<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Notes moved to Notes</title>
<!-- Browser Notes never stored anything (no localStorage, IndexedDB or cookies), so a redirect cannot hide user data. -->
<meta http-equiv="refresh" content="3; url=/notes/">
<link rel="canonical" href="https://kmads.dev/notes/">
<meta name="color-scheme" content="dark light">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         font: 16px/1.5 system-ui, sans-serif; background: #101010; color: #f5f5f5; }
  main { max-width: 32rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1rem; color: #c1c1c1; }
  a { color: #4da3ff; }
  @media (prefers-color-scheme: light) { body { background: #f5f5f5; color: #101010; } p { color: #5e5e5e; } a { color: #0060c0; } }
</style>
</head>
<body>
<main>
  <h1>Browser Notes moved to Notes</h1>
  <p>Notes is the new editor: tabs, Markdown and diagram previews, and files that save to your disk. Browser Notes never saved your text, so nothing is lost.</p>
  <p><a href="/notes/">Open Notes</a>. You go there in 3 seconds.</p>
</main>
</body>
</html>
